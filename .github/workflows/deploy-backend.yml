name: Deploy backend

# Deploys the backend to the EC2 instance through AWS Systems Manager.
# No SSH: port 22 stays restricted to the founder's IP.
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN  IAM role assumed through GitHub OIDC
#   EC2_INSTANCE_ID      Instance running the habilo-backend container
# The job is skipped until both are set.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: eu-west-1
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Migrations are manual SQL applied in Supabase. Deploying code ahead of its
      # migration would break production, so an automatic run stops here and the
      # deploy is launched by hand (Run workflow) once the SQL has been applied.
      - name: Stop automatic deploys that include migrations
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- backend/migrations | grep -q .; then
            echo "::error::This push changes backend/migrations. Apply the SQL in Supabase, then run this workflow manually."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and rebuild on the instance
        run: |
          cat > params.json <<'JSON'
          {
            "commands": [
              "sudo -u ubuntu -H bash -lc 'set -euo pipefail; cd /home/ubuntu/habilo; git fetch origin; git checkout main; git pull --ff-only origin main; cd backend; docker compose up -d --build; docker compose ps'"
            ],
            "executionTimeout": ["1200"]
          }
          JSON

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 60

          if [ "$status" != "Success" ]; then
            echo "::error::Deploy command finished with status $status"
            exit 1
          fi

      - name: Check the API answers
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS -m 10 https://api.habilo.es/servicio/resumen; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://api.habilo.es/servicio/resumen did not answer after the deploy"
          exit 1
